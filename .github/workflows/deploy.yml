name: Deploy to GitHub Pages

# Builds js/config.js from repository secrets, strips files that
# shouldn't be published, and deploys the result to Pages.
#
# Set the two secrets under:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL   https://<your-ref>.supabase.co
#     SUPABASE_KEY   sb_publishable_...

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/gen-config.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r css js *.html _site/
          # Never publish: schema, build tooling, repo docs.
          rm -rf _site/sql _site/scripts
          # Pages runs Jekyll by default, which ignores files starting
          # with an underscore. This turns that off.
          touch _site/.nojekyll
          echo "Published files:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
