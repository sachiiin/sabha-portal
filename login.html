<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b1130" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1130" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sabha">
<meta name="mobile-web-app-capable" content="yes">
<title>Sign in &middot; Dasanudas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column">

<div class="gm-login-shell">
  <div class="container container-tight">

    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <span class="gm-mark gm-mark--lg" id="brand-mark"></span>
      </div>
      <div class="gm-wordmark">Dasanudas<small>Gharmandir &middot; Sabha attendance</small></div>
    </div>

    <div class="card card-md">
      <div class="card-body">

        <div class="alert alert-danger d-none py-2 px-3" id="err" role="alert"></div>

        <!-- PIN -->
        <div id="pane-pin">
          <h2 class="h4 text-center mb-1">Enter the house PIN</h2>
          <p class="text-secondary text-center mb-4 small">
            View the dashboard and attendance history.
          </p>

          <form id="pin-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="pin">House PIN</label>
              <input type="password" id="pin" class="form-control form-control-lg text-center gm-pin"
                     inputmode="numeric" autocomplete="off" enterkeyhint="go"
                     placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="pin-submit">
              <i class="ti ti-lock-open me-1"></i> Continue
            </button>
          </form>

          <div class="hr-text hr-text-center my-4">or</div>

          <button class="btn w-100" id="to-admin">
            <i class="ti ti-user-shield me-1"></i> Sign in as sevak
          </button>
        </div>

        <!-- Email and password -->
        <div id="pane-admin" hidden>
          <h2 class="h4 text-center mb-1">Sevak sign-in</h2>
          <p class="text-secondary text-center mb-4 small">
            Record attendance and manage the roster.
          </p>

          <form id="admin-form" autocomplete="on" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input type="email" id="email" class="form-control" placeholder="you@example.com"
                     autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input type="password" id="password" class="form-control"
                     autocomplete="current-password" enterkeyhint="go" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="admin-submit">Sign in</button>
          </form>

          <div class="hr-text hr-text-center my-4">or</div>

          <button class="btn w-100" id="to-pin">
            <i class="ti ti-lock me-1"></i> Use the house PIN
          </button>
        </div>

      </div>
    </div>

    <p class="text-secondary text-center mt-3 mb-0 small">
      Ask a house sevak for the PIN.
    </p>

  </div>
</div>

<script type="module">
import { signIn, signInWithPin } from './js/auth.js';
import { sb } from './js/supabase.js';
import { applyTheme, MARK_SVG } from './js/lib/ui.js';

applyTheme();
document.getElementById('brand-mark').innerHTML = MARK_SVG;

const err = document.getElementById('err');
const panePin = document.getElementById('pane-pin');
const paneAdmin = document.getElementById('pane-admin');

function fail(msg) {
  err.textContent = msg;
  err.classList.remove('d-none');
}
function clearError() {
  err.classList.add('d-none');
}

function show(which) {
  clearError();
  const pin = which === 'pin';
  panePin.hidden = !pin;
  paneAdmin.hidden = pin;
  (pin ? document.getElementById('pin') : document.getElementById('email')).focus();
}

document.getElementById('to-admin').addEventListener('click', () => show('admin'));
document.getElementById('to-pin').addEventListener('click', () => show('pin'));

if (new URLSearchParams(location.search).get('e') === 'nolink') {
  fail('That account is not linked to a mandir yet.');
  show('admin');
}

sb.auth.getSession().then(({ data }) => {
  if (data.session) location.href = 'index.html';
});

// --- PIN ---

const pinForm = document.getElementById('pin-form');
const pinInput = document.getElementById('pin');
const pinSubmit = document.getElementById('pin-submit');

pinInput.addEventListener('input', clearError);

pinForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const pin = pinInput.value.trim();
  if (!pin) return fail('Enter the house PIN.');

  pinSubmit.disabled = true;
  pinSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Checking';

  try {
    await signInWithPin(pin);
    location.href = 'index.html';
  } catch (ex) {
    fail(ex.message);
    pinInput.value = '';
    pinInput.focus();
    pinSubmit.disabled = false;
    pinSubmit.innerHTML = '<i class="ti ti-lock-open me-1"></i> Continue';
  }
});

// --- email and password ---

const adminForm = document.getElementById('admin-form');
const adminSubmit = document.getElementById('admin-submit');

adminForm.addEventListener('input', clearError);

adminForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) return fail('Enter your email and password.');

  adminSubmit.disabled = true;
  adminSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in';

  try {
    await signIn(email, password);
    location.href = 'index.html';
  } catch (ex) {
    fail(ex.message);
    adminSubmit.disabled = false;
    adminSubmit.textContent = 'Sign in';
  }
});
</script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
